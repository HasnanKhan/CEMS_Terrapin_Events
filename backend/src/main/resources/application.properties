spring.application.name=terrapin-events
server.address=${CEMS_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${CEMS_DB_URL}
spring.datasource.username=${CEMS_DB_USER}
spring.datasource.password=${CEMS_DB_PASSWORD}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=4
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

cems.session.enabled=${CEMS_SESSION_ENABLED:false}
cems.session.db-url=${CEMS_SESSION_DB_URL:}
cems.session.db-user=${CEMS_SESSION_DB_USER:}
cems.session.db-password=${CEMS_SESSION_DB_PASSWORD:}
cems.session.service-token=${CEMS_SESSION_SERVICE_TOKEN:}
