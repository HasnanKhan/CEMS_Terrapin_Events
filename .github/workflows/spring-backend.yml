name: Spring backend

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Java 21 and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: terrapin
          POSTGRES_PASSWORD: terrapin_test
          POSTGRES_DB: terrapin_spring_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrapin -d terrapin_spring_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CEMS_DB_URL: jdbc:postgresql://127.0.0.1:5432/terrapin_spring_test
      CEMS_DB_USER: terrapin_catalog
      CEMS_DB_PASSWORD: terrapin_catalog_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Prepare disposable PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          {
            cat lib/schema.sql
            printf "\nCREATE ROLE terrapin_catalog LOGIN PASSWORD 'terrapin_catalog_test';\n"
            cat backend/sql/catalog-grants.sql backend/src/test/resources/catalog-fixtures.sql
          } | docker exec -i "$POSTGRES_CONTAINER" psql -U terrapin -d terrapin_spring_test -v ON_ERROR_STOP=1
      - name: Verify Spring Boot
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the Spring directory through Next.js
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          TEST_DATABASE_URL: postgresql://terrapin:terrapin_test@127.0.0.1:5432/terrapin_frontend_test
          TEST_RUNTIME_DATABASE_URL: postgresql://terrapin_runtime:terrapin_runtime_test@127.0.0.1:5432/terrapin_frontend_test
          TEST_SPRING_CATALOG_URL: http://127.0.0.1:3116
          PORT: '3116'
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U terrapin terrapin_frontend_test
          {
            cat lib/schema.sql
            printf "\nCREATE ROLE terrapin_runtime LOGIN PASSWORD 'terrapin_runtime_test';\n"
            cat lib/runtime-grants.sql
          } | docker exec -i "$POSTGRES_CONTAINER" psql -U terrapin -d terrapin_frontend_test -v ON_ERROR_STOP=1
          java -jar backend/target/terrapin-events-backend-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/cems-spring.log" 2>&1 &
          spring_pid=$!
          trap 'if [ -n "$spring_pid" ]; then kill "$spring_pid" 2>/dev/null || true; fi' EXIT
          curl --fail --silent --show-error --retry-all-errors --retry 15 --retry-delay 1 --max-time 3 "$TEST_SPRING_CATALOG_URL/actuator/health/readiness"
          npm run test:browser -- spring-catalog.spec.js
          kill "$spring_pid"
          wait "$spring_pid" || true
          spring_pid=''
          TEST_SPRING_CATALOG_OUTAGE=1 npm run test:browser -- spring-catalog.spec.js
