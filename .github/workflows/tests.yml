name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prototype:
    name: PostgreSQL and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: terrapin
          POSTGRES_PASSWORD: terrapin_test
          POSTGRES_DB: terrapin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terrapin -d terrapin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://terrapin:terrapin_test@127.0.0.1:5432/terrapin_test
      DATABASE_URL: postgresql://terrapin:terrapin_test@127.0.0.1:5432/terrapin_test
      DATABASE_URL_UNPOOLED: postgresql://terrapin:terrapin_test@127.0.0.1:5432/terrapin_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:setup
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run Chromium with the restricted database role
        env:
          RUNTIME_ENV_FILE: ${{ runner.temp }}/terrapin-runtime.env
        run: |
          npm run db:provision-runtime
          TEST_RUNTIME_DATABASE_URL="$(env -u DATABASE_URL node --env-file="$RUNTIME_ENV_FILE" -p 'process.env.DATABASE_URL')" npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: chromium-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
